[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "dataset-utils"
description = "Data and dataset utilities"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "label-studio",
    "Pillow",
    "pyyaml",
]
readme = "README.md"

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Repository = "https://github.com/prumos/dataset-utils"
Issues = "https://github.com/prumos/dataset-utils/issues"

[project.scripts]
gen-tasks = "dataset_utils.scripts.label_studio.gen_tasks:_run"
prepare-yolo-dataset = "dataset_utils.scripts.label_studio.prepare_yolo_dataset:_run"


[tool.setuptools.packages.find]
where = ["src"]
